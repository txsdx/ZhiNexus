# Android builds use an installable development certificate unless a stable publisher certificate is configured.
name: Build Android
on:
  workflow_call:
    inputs:
      publish_release:
        type: boolean
        default: false
      draft_release:
        type: boolean
        default: false
      tag:
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish an installable APK with the automatic GITHUB_TOKEN (custom signing key optional)
        type: boolean
        default: false
      tag:
        description: Existing or new draft release tag
        default: ""
      draft_release:
        description: Keep the Release as a draft
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Resolve SDK cache directory
        run: echo "ANDROID_CACHE_NDK=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.android/cache
            ${{ env.ANDROID_CACHE_NDK }}
          key: android-sdk-${{ runner.os }}-ndk-27.2.12479018-api35
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-all-crates: true
          cache-on-failure: true
          shared-key: android-aarch64
      - name: Prepare SDK and NDK
        run: |
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm test
      - run: node scripts/versions.mjs prepare android
      - name: Configure optional publisher signatures
        env:
          BUILD_PLATFORM: android
          UPDATER_PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node scripts/release-config.mjs
      - run: npm run tauri -- android init --ci
      - name: Align minimum Android version and detect template SDK
        id: project
        run: node scripts/configure-android.mjs
      - name: Install the SDK required by the current Tauri template
        run: sdkmanager "${{ steps.project.outputs.platform_package }}" "build-tools;${{ steps.project.outputs.compile_sdk }}.0.0"
      - run: npm run tauri -- android build --apk --target aarch64
      - name: Sign installable APK (custom release key optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash scripts/android-sign.sh
      - name: Sign APK update metadata when a publisher key exists
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/sign-release-files.mjs release-files
      - name: Build native debug APK for device tests (not published)
        run: npm run tauri -- android build --debug --apk --target x86_64
      - name: Enable hosted-runner KVM for Android 15 tests
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Test installed app on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -feature -Vulkan
          script: |
            adb install -r src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
            node scripts/android-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-device-test-results
          path: android-test-results/
      - if: inputs.publish_release
        name: Prepare shared update metadata
        run: |
          curl --fail --silent --show-error --location 'https://github.com/txsdx/ZhiNexus/releases/latest/download/latest.json' -o previous-latest.json || rm -f previous-latest.json
          node scripts/updater-manifest.mjs release-files
        env:
          RELEASE_TAG: ${{ inputs.tag }}
      - if: inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_DRAFT: ${{ inputs.draft_release }}
        run: |
          expected_tag="v$(node scripts/versions.mjs release)"
          release_tag="${RELEASE_TAG:-$expected_tag}"
          test "$release_tag" = "$expected_tag"
          if ! gh release view "$release_tag"; then
            draft_args=()
            if [ "$RELEASE_DRAFT" = true ]; then draft_args+=(--draft); fi
            gh release create "$release_tag" "${draft_args[@]}" --title "ZhiNexus $release_tag" --notes-file .ai/CHANGELOG.md
          fi
          mapfile -d '' assets < <(find release-files -type f \( -name '*.apk' -o -name '*.sig' -o -name 'latest.json' \) -print0)
          gh release upload "$release_tag" "${assets[@]}" --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: ZhiNexus-Android
          path: |
            release-files/*.apk
            release-files/*.sig
