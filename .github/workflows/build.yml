# One manual entry: compile the web assets once, then package and test every native target in parallel.
name: Build and release
on:
  workflow_dispatch:
    inputs:
      create_release:
        description: Publish Release
        type: boolean
        default: false
      draft:
        description: Save Release as draft
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:release
      - run: npm run build
      - name: Seal shared frontend
        run: node scripts/frontend-artifact.mjs create
      - uses: actions/upload-artifact@v4
        with:
          name: shared-frontend
          include-hidden-files: true
          path: dist/
          retention-days: 7
  desktop:
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
          - platform: ubuntu
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        if: runner.os == 'Windows'
        with:
          path: |
            ~/AppData/Local/tauri
            ~/AppData/Local/tauri-cli
          key: tauri-bundlers-${{ runner.os }}-v2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-all-crates: true
          cache-on-failure: true
          shared-key: desktop-${{ matrix.platform == 'windows' && 'windows-x64' || 'ubuntu-24.04-x64' }}
      - if: runner.os == 'Linux'
        name: Install Ubuntu native dependencies
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Acquire::Retries=2 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::https::Timeout=30 install --no-install-recommends -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf webkit2gtk-driver xvfb dbus-x11 libpipewire-0.3-dev libgbm-dev libxcb-randr0-dev libclang-dev tesseract-ocr tesseract-ocr-eng tesseract-ocr-chi-sim
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: shared-frontend
          path: dist
      - name: Verify and use shared frontend
        run: node scripts/frontend-artifact.mjs use
      - run: node scripts/versions.mjs prepare ${{ matrix.platform }}
      - name: Configure optional updater signing
        id: metadata
        env:
          UPDATER_PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          BUILD_PLATFORM: ${{ matrix.platform }}
        run: node scripts/release-config.mjs
      - uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ steps.metadata.outputs.signing == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --bundles ${{ matrix.platform == 'windows' && 'nsis' || 'deb' }}
      - name: Package portable and setup executables without recompiling
        if: runner.os == 'Windows'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ steps.metadata.outputs.signing == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: pwsh
        run: ./scripts/package-portable.ps1
      - name: Prepare Windows native UI driver
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/start-windows-driver.ps1
      - name: Test real Windows storage and portable recovery
        if: runner.os == 'Windows'
        run: node scripts/native-smoke.mjs
      - name: Prepare native driver and extract Ubuntu DEB
        if: runner.os == 'Linux'
        run: bash scripts/start-linux-driver.sh
      - name: Test the packaged Ubuntu executable and portable recovery
        if: runner.os == 'Linux'
        run: node scripts/native-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ runner.os }}-native-test-results
          path: |
            native-test-results/
            ${{ runner.temp }}/tauri-driver.log
            ${{ runner.temp }}/tauri-driver.err.log
      - name: Sign Ubuntu DEB when a publisher key is configured
        if: runner.os == 'Linux'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ steps.metadata.outputs.signing == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/sign-release-files.mjs src-tauri/target/release/bundle/deb
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ZhiNexus-${{ matrix.platform == 'windows' && 'windows-x64' || 'ubuntu-24.04-x64' }}
          path: |
            release-files/*.exe
            release-files/*.sig
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/deb/*.sig
  android:
    needs: frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Reserve space for two Android ABIs and the API 35 emulator
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/swift /opt/hostedtoolcache/CodeQL
          if [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME/ndk" ]; then
            for ndk_dir in "$ANDROID_HOME"/ndk/*; do
              if [ -d "$ndk_dir" ] && [ "${ndk_dir##*/}" != '27.2.12479018' ]; then
                sudo rm -rf -- "$ndk_dir"
              fi
            done
          fi
          df -h /
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Prepare writable NDK cache
        run: |
          echo "ANDROID_CACHE_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          if [ -d "$ANDROID_HOME/ndk/27.2.12479018" ]; then
            sudo chown -R "$(id -u):$(id -g)" "$ANDROID_HOME/ndk/27.2.12479018"
          fi
      - uses: actions/cache/restore@v4
        id: sdk-cache
        with:
          path: |
            ~/.android/cache
            ${{ env.ANDROID_CACHE_ROOT }}/ndk/27.2.12479018
          # Avoid restoring the runner's root-owned SDK or the old full-SDK cache.
          key: android-ndk-${{ runner.os }}-27.2.12479018-v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-all-crates: true
          cache-on-failure: true
          shared-key: android-aarch64
      - name: Prepare SDK and NDK
        run: |
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: shared-frontend
          path: dist
      - name: Verify and use shared frontend
        run: node scripts/frontend-artifact.mjs use
      - run: node scripts/versions.mjs prepare android
      - name: Configure optional publisher signatures
        env:
          BUILD_PLATFORM: android
          UPDATER_PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node scripts/release-config.mjs
      - run: npm run tauri -- android init --ci
      - name: Align minimum Android version and detect template SDK
        id: project
        run: node scripts/configure-android.mjs
      - name: Install the SDK required by the current Tauri template
        id: sdk-template
        run: sdkmanager "${{ steps.project.outputs.platform_package }}" "build-tools;${{ steps.project.outputs.compile_sdk }}.0.0"
      - run: npm run tauri -- android build --apk --target aarch64
      - name: Sign installable APK (custom release key optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash scripts/android-sign.sh
      - name: Sign APK update metadata when a publisher key exists
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/sign-release-files.mjs release-files
      - name: Build native debug APK for device tests (not published)
        run: npm run tauri -- android build --debug --apk --target x86_64
      - name: Enable hosted-runner KVM for Android 15 tests
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
      - uses: actions/cache/restore@v4
        id: image-cache
        with:
          path: ${{ env.ANDROID_CACHE_ROOT }}/system-images/android-35/google_apis/x86_64
          key: android-test-image-api35-google-apis-x86_64-v1
      - name: Test installed app on Android 15
        id: device-test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          avd-name: zhinexus-ci
          # The default Pixel data partition exceeds available space after compiling both Rust ABIs.
          disk-size: 2048M
          emulator-boot-timeout: 180
          disable-animations: true
          pre-emulator-launch-script: |
            # AVD profiles and the action append duplicate keys; keep one authoritative data-partition setting.
            sed -i '/^[[:space:]]*disk\.dataPartition\.size[[:space:]]*=/d' "$HOME/.android/avd/zhinexus-ci.avd/config.ini"
            printf '\ndisk.dataPartition.size=2048M\n' >> "$HOME/.android/avd/zhinexus-ci.avd/config.ini"
            # APKs already contain the shared library. These workspace archives are not retained by rust-cache.
            find src-tauri/target/aarch64-linux-android src-tauri/target/x86_64-linux-android -type f \( -name 'libzhinexus_lib*.a' -o -name 'libzhinexus_lib*.rlib' \) -delete
            df -h /
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -feature -Vulkan
          script: |
            adb install -r src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
            node scripts/android-smoke.mjs
      - name: Verify factory image is complete before caching
        id: image-ready
        if: always()
        run: |
          test -s "$ANDROID_HOME/system-images/android-35/google_apis/x86_64/package.xml"
          test -s "$ANDROID_HOME/system-images/android-35/google_apis/x86_64/system.img"
      - uses: actions/cache/save@v4
        if: always() && steps.image-ready.outcome == 'success' && steps.image-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ env.ANDROID_CACHE_ROOT }}/system-images/android-35/google_apis/x86_64
          key: ${{ steps.image-cache.outputs.cache-primary-key }}
      - uses: actions/cache/save@v4
        if: always() && steps.sdk-template.outcome == 'success' && steps.sdk-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.android/cache
            ${{ env.ANDROID_CACHE_ROOT }}/ndk/27.2.12479018
          key: ${{ steps.sdk-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-device-test-results
          path: android-test-results/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ZhiNexus-Android
          path: |
            release-files/*.apk
            release-files/*.sig
  publish:
    needs: [desktop, android]
    if: inputs.create_release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: ZhiNexus-*
          merge-multiple: true
          path: release-artifacts
      - name: Preserve metadata for unchanged platforms
        run: curl --fail --silent --show-error --location 'https://github.com/txsdx/ZhiNexus/releases/latest/download/latest.json' -o previous-latest.json || rm -f previous-latest.json
      - name: Build platform-specific update manifest
        run: node scripts/updater-manifest.mjs release-artifacts
      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DRAFT: ${{ inputs.draft }}
        run: node scripts/publish-release.mjs release-artifacts
