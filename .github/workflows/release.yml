# Build and validate every supported platform before optional publication.
name: Release
on:
  workflow_dispatch:
    inputs:
      create_release:
        description: Create Release
        type: boolean
        default: true
      draft:
        description: Save as draft
        type: boolean
        default: true
permissions:
  contents: write
jobs:
  windows:
    uses: ./.github/workflows/windows.yml
    secrets: inherit
  android:
    uses: ./.github/workflows/android.yml
    secrets: inherit
  ubuntu:
    uses: ./.github/workflows/ubuntu.yml
    secrets: inherit
  publish:
    needs: [windows, android, ubuntu]
    if: inputs.create_release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: ZhiNexus-*
          merge-multiple: true
          path: release-artifacts
      - name: Preserve metadata for unchanged platforms
        run: curl --fail --silent --show-error --location 'https://github.com/txsdx/ZhiNexus/releases/latest/download/latest.json' -o previous-latest.json || rm -f previous-latest.json
      - name: Build platform-specific update manifest
        run: node scripts/updater-manifest.mjs release-artifacts
      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DRAFT: ${{ inputs.draft }}
        run: node scripts/publish-release.mjs release-artifacts
