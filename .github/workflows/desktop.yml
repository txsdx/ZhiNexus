# Manual build tests only. Publication belongs to the separate Release workflow.
name: Build selected platforms
on:
  workflow_dispatch:
    inputs:
      build_windows:
        description: Windows_latest_x64
        type: boolean
        default: true
      build_android:
        description: Android_15+_arm64-v8a
        type: boolean
        default: false
      build_ubuntu:
        description: Ubuntu_24.04+_x64
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  validate_selection:
    runs-on: ubuntu-latest
    steps:
      - name: Require at least one target
        env:
          WINDOWS: ${{ inputs.build_windows }}
          ANDROID: ${{ inputs.build_android }}
          UBUNTU: ${{ inputs.build_ubuntu }}
        run: test "$WINDOWS" = true || test "$ANDROID" = true || test "$UBUNTU" = true
  windows:
    needs: validate_selection
    if: inputs.build_windows
    uses: ./.github/workflows/windows.yml
    secrets: inherit
  android:
    needs: validate_selection
    if: inputs.build_android
    uses: ./.github/workflows/android.yml
    secrets: inherit
  ubuntu:
    needs: validate_selection
    if: inputs.build_ubuntu
    uses: ./.github/workflows/ubuntu.yml
    secrets: inherit
