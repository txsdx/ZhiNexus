# Artifact-only completion: the unchanged application and all three original packages are pinned and verified; no compilation.
name: Build and release
on:
  workflow_dispatch:
    inputs:
      create_release:
        description: Publish Release
        type: boolean
        default: false
      draft:
        description: Save Release as draft
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify only the test harness changed and check protocol boundaries
        run: |
          git diff --exit-code d96b75926788060ddbe99275ee9106ca4d29b588 HEAD -- src src-tauri package.json package-lock.json versions.json
          if ($LASTEXITCODE -ne 0) { throw 'Application source changed: reusing the original binary is forbidden' }
          node --test scripts/native-driver.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'WebDriver protocol regressions failed' }
      - uses: actions/download-artifact@v4
        with:
          name: ZhiNexus-windows-x64
          run-id: 40915600674
          github-token: ${{ github.token }}
          path: downloaded
      - name: Verify and stage the original Windows executable without compiling
        shell: pwsh
        run: |
          $captureExe = @(Get-ChildItem downloaded -Recurse -File -Filter 'ZhiNexus_windows_x64_0.21.0_protable.exe')
          if ($captureExe.Count -ne 1) { throw 'Expected exactly one original Windows executable' }
          if ((Get-FileHash $captureExe[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'dd8969a06438144462a6072bab6d2efc3ed5f03c0cdfcd00cce47819d50faa1e') { throw 'Original Windows executable digest mismatch' }
          New-Item -ItemType Directory -Force release-files | Out-Null
          Copy-Item $captureExe[0].FullName release-files/ZhiNexus_windows_x64_0.21.0_protable.exe
      - name: Prepare Windows native UI driver
        shell: pwsh
        run: ./scripts/start-windows-driver.ps1
      - name: Windows 实包复验（窗口、存储、更新）
        env:
          TAURI_APPLICATION: release-files/ZhiNexus_windows_x64_0.21.0_protable.exe
        run: node scripts/native-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-native-test-results
          path: |
            native-test-results/
            ${{ runner.temp }}/tauri-driver.log
            ${{ runner.temp }}/tauri-driver.err.log
  publish:
    needs: desktop
    if: inputs.create_release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: ZhiNexus-*
          run-id: 40915600674
          github-token: ${{ github.token }}
          merge-multiple: true
          path: release-artifacts
      - name: Verify all three original package bytes
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import path from 'node:path';import {createHash} from 'node:crypto';
          const expected={'ZhiNexus_windows_x64_0.21.0_protable.exe':'dd8969a06438144462a6072bab6d2efc3ed5f03c0cdfcd00cce47819d50faa1e','ZhiNexus_0.21.0_amd64.deb':'00bfc7a4329946c3416726fc6f145d9d9aa29b11e289872821821c9ab4bdbcb4','ZhiNexus_android_arm64_0.21.0_development.apk':'e66d6c5aaaf99cc90ae38ab5155b124aa35511cb7ffa70710a05540e48a95773'};
          const files=fs.readdirSync('release-artifacts',{recursive:true});
          for(const[name,hash]of Object.entries(expected)){const matches=files.filter(f=>path.basename(f)===name);if(matches.length!==1)throw Error('Missing or repeated original package');const bytes=fs.readFileSync(path.join('release-artifacts',matches[0]));if(createHash('sha256').update(bytes).digest('hex')!==hash)throw Error('Original package digest mismatch');console.log('Verified original package:',name);}
          JS
      - name: Verify the existing application tag and draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          const read=(p)=>JSON.parse(execFileSync('gh',['api','repos/txsdx/ZhiNexus/'+p],{encoding:'utf8'}));
          if(read('git/ref/tags/v0.21.0').object.sha!=='d96b75926788060ddbe99275ee9106ca4d29b588')throw Error('Application tag mismatch');
          const release=read('releases/428144187');if(release.tag_name!=='v0.21.0'||!release.draft||release.target_commitish!=='d96b75926788060ddbe99275ee9106ca4d29b588')throw Error('Original draft mismatch');
          JS
      - name: Build platform-specific update manifest
        run: node scripts/updater-manifest.mjs release-artifacts
      - name: Upload verified packages to the existing draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DRAFT: ${{ inputs.draft }}
        run: node scripts/publish-release.mjs release-artifacts
